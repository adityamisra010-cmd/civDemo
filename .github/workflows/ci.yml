name: CI

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Banned-constructs check (m0-kernel-spec §3.7)
        run: ./scripts/check-banned-constructs.sh

      - name: Read-isolation check (T2.6 — grievance read by nothing but UI/chronicle)
        run: ./scripts/check-read-isolation.sh

      - name: Research content audit is current (ADR-029 addendum A — the content is authored)
        run: python3 scripts/research-content-audit.py --check

      - name: Research calibration report is current (provisional — ADR-029 addendum A, ADR-030)
        run: python3 scripts/research-calibration-report.py --check
      - name: Research → gameplay unlock audit is current (R1 — every node's content-declared consequence)
        run: python3 scripts/research-gameplay-unlock-audit.py --check

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Sim.slnx

      - name: Build
        run: dotnet build Sim.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Sim.slnx --no-build --configuration Release

      - name: Read-only view mutation must not compile (T0.2 acceptance)
        run: ./scripts/check-readonly-proof.sh

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Sim.slnx

      - name: Build
        run: dotnet build Sim.slnx --no-restore --configuration Release

      - name: Determinism harness (T0.8 permanent regression gate)
        run: |
          # Default step shell is 'bash -e': capture the pipeline status with
          # '|| status=$?' so the summary below is published on FAILURE too.
          set -o pipefail
          status=0
          start=$(date +%s)
          dotnet test Sim.slnx --no-build --configuration Release \
            --filter "suite=determinism" 2>&1 | tee determinism.log || status=$?
          end=$(date +%s)
          {
            echo "### Determinism harness (T0.8)"
            echo "Runtime: $((end-start))s (budget: ~300s ceiling — T2.11 sized the founded legs to 300 turns across the era gate; measured ~65s unloaded, founding+stepping dominate)"
            tail -n 3 determinism.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  determinism-xproc:
    name: determinism-xproc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build CLI
        run: dotnet build Sim.Cli/Sim.Cli.csproj --configuration Release

      - name: Cross-process determinism (T0.9)
        run: |
          # Separate PROCESSES surface environment/culture/JIT divergence that
          # the in-process T0.8 twins structurally share.
          CLI="dotnet Sim.Cli/bin/Release/net10.0/Sim.Cli.dll"

          $CLI run --seed 42 --turns 400 --hash-log run-a.log
          $CLI run --seed 42 --turns 400 --hash-log run-b.log
          if ! diff run-a.log run-b.log > xproc.diff; then
            echo "CROSS-PROCESS DIVERGENCE — first divergent turn:"
            head -n 5 xproc.diff
            exit 1
          fi
          echo "orderless: two processes byte-identical over 400 turns"

          python3 scripts/gen-sample-orders.py sample-orders.bin 400
          $CLI run --seed 42 --turns 400 --orders sample-orders.bin --hash-log ordered.log
          $CLI replay --seed 42 --turns 400 --orders sample-orders.bin --hash-log replayed.log
          if ! diff ordered.log replayed.log > replay.diff; then
            echo "REPLAY DIVERGENCE — first divergent turn:"
            head -n 5 replay.diff
            exit 1
          fi
          echo "replay: byte-identical to the ordered run over 400 turns"

          # T1.9: the same discipline on the FOUNDED production world
          # (1024^2, N = 12). T2.11: 300 turns - the founded-harness horizon,
          # which since T2.11 CROSSES the era-pacing gate at turn 250 (dt
          # 10 -> 5), so cross-process determinism covers the dt transition;
          # each process is ~3s founding + ~1s stepping, the four runs below
          # add well under a minute to the job.
          # 300-turn horizon => orders at turns 0..280: the 260/280 orders
          # land AFTER the era gate, so ordered delivery in the Bronze dt=5
          # regime is exercised cross-process too (adversarial pass finding).
          python3 scripts/gen-sample-orders.py founded-orders.bin 300 --labor
          $CLI run --founded --seed 42 --turns 300 --hash-log f-run-a.log
          $CLI run --founded --seed 42 --turns 300 --hash-log f-run-b.log
          if ! diff f-run-a.log f-run-b.log > f-xproc.diff; then
            echo "FOUNDED CROSS-PROCESS DIVERGENCE — first divergent turn:"
            head -n 5 f-xproc.diff
            exit 1
          fi
          echo "founded orderless: two processes byte-identical over 300 turns"

          # Absolute pin (T1.9 adversarial hardening): the built binary's
          # founded run must land on the SAME golden the in-test constant pins
          # (SnapshotTests.FoundedGolden). A founding/pipeline bypass inside
          # the CLI that self-diffs cleanly still fails here. Update this hash
          # together with the test constant, deliberately.
          # T4.21-4: moved with SnapshotTests.FoundedGolden for the arming of
          # the famine-class disaster (sim.json disaster.hazardPerYear
          # 0.0 -> 0.01), to a1def4df...
          # T4.21-7: moved BACK with it for the DISARMING (0.01 -> 0.0), which is
          # CR-016's orchestrator decision — the mechanism ships complete and
          # tested but INERT and the RATE is the director's ruling
          # (docs/adr/cr-016-armed-disaster-fallout.md). The value below is the
          # pre-arming one, returned BYTE FOR BYTE. Re-derived by REPRODUCING
          # THIS STEP on the disarmed tree: the two CLI processes above, built
          # from this tree, both logs byte-identical, last line the value below.
          # ADR-029: schema v26 (research tables) + ResearchSystem's own rows
          # (Eurekas on available roots in this order-less world). Derived twice on
          # this tree — the in-test harness and two CLI processes with byte-identical
          # logs; IntegratedPinAttributionTests strips the research layer and returns
          # the previous value (db7c7a09…) byte for byte.
          # Research finalization (ADR-029 addendum A): two more empty v26 count
          # prefixes, and this order-less world now writes no research row. Derived
          # twice on this tree (in-test harness; two CLI processes, byte-identical
          # logs); the research strip still returns db7c7a09… byte for byte.
          # ADR-032: schema v29 appends two EMPTY transport tables (no DevelopRoads order in
          # this order-less world). Derived twice on this tree (in-test harness; two CLI
          # processes, byte-identical logs); IntegratedPinAttributionTests strips the two
          # tables and returns the previous value (15c63d65…) byte for byte.
          # ADR-033 D4 (2026-10-02): schema v30 appends one EMPTY TaxPolicies table (no tax is levied in
          # this order-less world) and GovernanceSystem writes the administrative reach into
          # ControlRow.Strength. Derived twice on this tree (in-test harness; two CLI processes,
          # byte-identical logs); IntegratedPinAttributionTests strips the governance layer and returns
          # the previous value (b2c0032f…) byte for byte. CiPinAgreementTests now compares this value to
          # SnapshotTests.FoundedGoldenHash EXACTLY (m5-full-build left it behind under a Contains guard).
          # ADR-033 D6 + D10 (2026-10-02): schema v31 appends two EMPTY tables (Institutions,
          # ConstructionLabor — nothing is built in this order-less world). Derived twice on this tree
          # (in-test harness; two CLI processes, byte-identical logs); IntegratedPinAttributionTests
          # strips the institutions layer and returns the previous value (64820f83…) byte for byte.
          # R1 (2026-10-03): research-gated recipes (BEHAVIOUR: no pottery fired or bronze cast before
          # pottery_open_fired / tin_bronze). Derived twice on this tree (in-test harness; two CLI
          # processes, byte-identical logs); IntegratedPinAttributionTests' recipe-knowledge control runs
          # the content twin without the recipe links and returns the previous value (74306d6a…) byte for byte.
          FOUNDED_GOLDEN=68c629b66badfa717514e91c6efe9aaa2f8874d272d21afcee283fe1d85ce655
          if [ "$(tail -n 1 f-run-a.log)" != "$FOUNDED_GOLDEN" ]; then
            echo "FOUNDED RUN DIVERGED FROM PINNED GOLDEN:"
            echo "  expected $FOUNDED_GOLDEN"
            echo "  actual   $(tail -n 1 f-run-a.log)"
            exit 1
          fi
          echo "founded run matches the pinned golden"

          $CLI run --founded --seed 42 --turns 300 --orders founded-orders.bin --hash-log f-ordered.log
          $CLI replay --founded --seed 42 --turns 300 --orders founded-orders.bin --hash-log f-replayed.log
          if ! diff f-ordered.log f-replayed.log > f-replay.diff; then
            echo "FOUNDED REPLAY DIVERGENCE — first divergent turn:"
            head -n 5 f-replay.diff
            exit 1
          fi
          echo "founded replay: byte-identical to the ordered run over 300 turns"

          # M5 integration (audit E4): the founded world with ONE AI Empire. The player's
          # orders (kinds 3, 4, 6 — gen-sample-orders.py --founded-mix) are merged with the
          # AI's (kinds 4-8: construction, tax, research, Age, roads — the AI levies at 547,
          # hence 600 turns) into the RUN LOG --emit-session writes. Two processes must agree
          # byte for byte (hash logs and run logs), `sim replay` of that run log (no AI
          # producer) must reproduce every hash, and `sim inspect` must verify the record.
          python3 scripts/gen-sample-orders.py mix-orders.bin 600 --founded-mix
          $CLI run --founded --seed 42 --turns 600 --ai-empires 1 --orders mix-orders.bin --hash-log ai-a.log --emit-session ai-a
          $CLI run --founded --seed 42 --turns 600 --ai-empires 1 --orders mix-orders.bin --hash-log ai-b.log --emit-session ai-b
          if ! diff ai-a.log ai-b.log > ai-xproc.diff || ! cmp ai-a/orders-*.bin ai-b/orders-*.bin; then
            echo "AI-EMPIRE CROSS-PROCESS DIVERGENCE:"
            head -n 5 ai-xproc.diff
            exit 1
          fi
          python3 - ai-a/orders-*.bin <<'PY'
          import struct, sys
          b = open(sys.argv[1], "rb").read()
          n = struct.unpack_from("<i", b, 12)[0]
          kinds = {struct.unpack_from("<qiiid", b, 16 + 28 * i)[2] for i in range(n)}
          missing = set(range(3, 9)) - kinds
          print(f"run log: {n} orders, kinds {sorted(kinds)}")
          sys.exit(f"order kinds never issued: {sorted(missing)}" if missing else 0)
          PY
          $CLI replay --founded --seed 42 --turns 600 --ai-empires 1 --orders ai-a/orders-*.bin --hash-log ai-replayed.log
          if ! diff ai-a.log ai-replayed.log > ai-replay.diff; then
            echo "AI-EMPIRE REPLAY DIVERGENCE — first divergent turn:"
            head -n 5 ai-replay.diff
            exit 1
          fi
          $CLI inspect --manifest ai-a/session-*.json --turn 600 | tee ai-inspect.log
          grep -q "reproduction VERIFIED" ai-inspect.log
          echo "ai-empire leg: two processes, replay and inspect agree over 600 turns"

  calibration:
    # T2.8: the calibration battery as its own TIME-BOXED job — corridor
    # drift fails CI without hiding inside the main test wall-clock. The
    # ≥20-seed sweep is the NIGHTLY command (schedule below):
    #   dotnet run --project Sim.Cli -c Release -- \
    #     autoplay --seeds 20 --turns 650 --metrics nightly-metrics.json
    name: calibration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Battery (CI members — 2 canonical + 2 dev seeds, corridors.json bands)
        run: dotnet test Sim.Tests --configuration Release --filter CalibrationBatteryTests

  calibration-nightly:
    # The ≥20-seed sweep: too slow for every push, mandatory once a day.
    # Runs the same corridors via `sim autoplay` and uploads the metrics
    # JSON as an artifact for offline corridor analysis.
    name: calibration-nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 20-seed autoplay sweep
        run: |
          dotnet run --project Sim.Cli -c Release -- \
            autoplay --seeds 20 --turns 650 --metrics nightly-metrics.json
      - name: Corridor teeth across all 20 seeds (bands + quarantines from corridors.json)
        # T3.12 — QUARANTINE AWARENESS. A corridor may declare
        # `quarantine: {active: true, window: [lo, hi]}` beside its band: a
        # KNOWN, RULED deviation whose target band is deliberately left
        # un-retuned. Such a corridor is reported QUARANTINED WITH ITS MEASURED
        # RANGE and does NOT gate. It must not go silent either — that is the
        # whole defect this closes. The band stayed [0.15, 0.6] while the
        # project quarantined density at [1.40, 1.80] in the battery, this step
        # read only the band, and the nightly was RED FOR ELEVEN CONSECUTIVE
        # RUNS across T3.5b/T3.6/T3.6b/T3.8/T3.9a/T3.9b/T3.11 — half of M3
        # shipped under an instrument that was already dark. Nothing checked the
        # checker. corridors.json is now the single source both readers use.
        #
        # M4 CLOSURE (blocker B5) — THE RESIDUAL, AND WHY THIS IS NO LONGER jq.
        # T3.12 closed the silence but not the COMPARISON. The step printed the
        # measured range beside the recorded window and never compared them, so a
        # quarantined corridor drifting clean out of its own window printed exactly
        # like one sitting inside it — and the gate short-circuited on
        # `quarantine.active` before anything looked. B5 is that firing:
        # densityPerArableKm2 at seed 3 measures 0.35415668759623087 against a
        # window floor of 0.3685744951368359, 3.91 % below, and no shipped
        # instrument could see it (the battery's canonical theory runs seeds 1
        # and 2, both comfortably inside).
        #
        # The judgement therefore moved out of an untested jq expression and into
        # Sim.Core/Kernel/CorridorStatus.cs, which Sim.Tests exercises directly
        # (CorridorStatusTests — 5 mutants killed, each by a semantic test).
        # T3.12's own lesson applied one level up: nothing checked the checker.
        #
        # THE GATE'S MEANING IS UNCHANGED: exit 1 only for a liveness failure or a
        # NON-quarantined corridor out of band. A quarantined corridor reports and
        # does not gate, whatever its window says. No band, window, quarantine flag
        # or simulation behaviour moved with this change.
        run: |
          dotnet run --project Sim.Cli -c Release -- \
            corridors --metrics nightly-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-metrics
          path: nightly-metrics.json
