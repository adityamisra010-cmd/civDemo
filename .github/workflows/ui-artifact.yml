name: ui-artifact

# T1.10 (D-023, formalized): the playable Windows build.
#   - every packet branch push (t[0-9]*.*) → gate zip for Director Visual Gates
#   - every candidate branch push (claude/**) → the same, for remote-session
#     branches. M4's exit criterion asks for a session "from the CI zip"; the
#     M4 candidate lives on claude/civdemo-work-b1z2y4, which matched none of
#     the patterns below, so no zip was built for the very commit the exit
#     session is held against. Found by the M4 final closure audit; the zip for
#     95faa61 was first produced by workflow_dispatch (run 35568905793,
#     sim-ui-win-x64-95faa61) and this line is what stops that being manual.
#   - every push to main      → the "latest playable" artifact per merge
#   - release: published      → the zip is ATTACHED to the GitHub Release as a
#     permanent asset (runs on GitHub's runners, so milestone releases become
#     permanently downloadable games regardless of any dev-container limits).
# Build identity: -p:BuildSha/-p:BuildDate stamp the window title + debug panel
# ("civ-sim M3 (<sha>, <date>)") — the director always knows which build he
# is holding. Artifact name carries the same sha: sim-ui-win-x64-<sha>.
on:
  workflow_dispatch:
  push:
    branches: ['main', 't[0-9]*.*', 'art-*', 'claude/**']
  release:
    types: [published]

jobs:
  ui-artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only by the release-asset upload step
    outputs:
      sha: ${{ steps.ident.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute build identity
        id: ident
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # T3.11 Item 4c (director queue line, T3.9b gate session): the zip root
      # used to hold ~40 runtime DLLs with the exe mixed in, so the director
      # scrolled past coreclr/clrjit/System.Private.CoreLib every gate and
      # `runs/` — the thing a gate session PRODUCES — sorted to the bottom.
      #
      # The whole self-contained tree publishes UNCHANGED into `app/`; only
      # the launcher sits at the root. This is a packaging change, not a
      # post-publish file shuffle: .NET's self-contained layout expects its
      # runtime beside the executable, so moving files after publish would
      # break the app. Two facts on the current tree make it zero-code-change,
      # both re-verified at T3.11 rather than taken from the queue line:
      #   - UiSession.SessionLogPath builds Path.Combine("runs", …) — RELATIVE,
      #     resolved against the WORKING DIRECTORY, so a launcher that leaves
      #     cwd at the zip root puts `runs/` at the root by itself.
      #   - AssetManifest resolves art at Path.Combine(AppContext.BaseDirectory,
      #     "assets") — the EXE's directory, not cwd — so `assets/` travels
      #     with the exe into `app/` and keeps working.
      # PublishSingleFile was REJECTED: MonoGame.Framework.DesktopGL loads
      # SDL2/openal/cimgui as native libraries and self-extract changes where
      # those resolve, and it would invalidate the completeness assertion
      # below. A gate-ergonomics fix must not put the gate build at risk.
      - name: Publish Sim.Ui (win-x64, self-contained, identity-stamped)
        run: >
          dotnet publish Sim.Ui/Sim.Ui.csproj -c Release -r win-x64
          --self-contained -o publish/sim-ui-win-x64/app
          -p:BuildSha=${{ steps.ident.outputs.sha }}
          -p:BuildDate=${{ steps.ident.outputs.date }}

      - name: Write the launcher (the only file at the zip root)
        # CRLF and `cd /d "%~dp0"`: the launcher forces cwd to ITS OWN
        # directory — the zip root — so `runs/` lands beside the launcher and
        # not inside app/. `start ""` inherits that cwd for the child.
        run: |
          set -e
          printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" "app\\Sim.Ui.exe"\r\n' \
            > "publish/sim-ui-win-x64/Play civ-sim.cmd"
          cat "publish/sim-ui-win-x64/Play civ-sim.cmd"

      - name: Assert the publish is complete (director hardening, T1.7)
        # An empty or partial publish must never go green: the exe and every
        # native the window needs are asserted BEFORE upload, and the file
        # count is printed so the run log shows what shipped.
        # T3.11 4c: these paths moved under app/ WITH the publish — the
        # assertion is the reason a partial publish cannot go green, so it
        # follows the tree rather than being relaxed. The launcher is asserted
        # too: a zip whose root file is missing is exactly the defect this
        # change exists to prevent.
        run: |
          set -e
          for f in Sim.Ui.exe SDL2.dll openal.dll cimgui.dll; do
            test -f "publish/sim-ui-win-x64/app/$f" || { echo "MISSING: app/$f"; exit 1; }
          done
          test -f "publish/sim-ui-win-x64/Play civ-sim.cmd" || { echo "MISSING: launcher"; exit 1; }
          test -d "publish/sim-ui-win-x64/app/assets" || { echo "MISSING: app/assets"; exit 1; }
          echo "zip root: $(ls publish/sim-ui-win-x64 | tr '\n' ' ')"
          echo "app/ contains $(ls publish/sim-ui-win-x64/app | wc -l) files, $(du -sh publish/sim-ui-win-x64/app | cut -f1)"

      - name: Upload artifact zip
        uses: actions/upload-artifact@v4
        with:
          name: sim-ui-win-x64-${{ steps.ident.outputs.sha }}
          path: publish/sim-ui-win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Attach zip to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publish
          zip -qr "sim-ui-win-x64-${{ steps.ident.outputs.sha }}.zip" sim-ui-win-x64
          gh release upload "${{ github.event.release.tag_name }}" \
            "sim-ui-win-x64-${{ steps.ident.outputs.sha }}.zip" \
            --repo "${{ github.repository }}" --clobber
          echo "attached sim-ui-win-x64-${{ steps.ident.outputs.sha }}.zip to release ${{ github.event.release.tag_name }}"

  # M5 hardening H1 (Director 2026-10-05 §1/§2/§15): THE SHIPPED BINARY IS GATED ON WINDOWS. The Director's
  # playtest build passed every test and aborted on the first click of Research (imgui_draw.cpp:2261, a 16-bit
  # index overflow) because no test ever ran the live ImGui UI. This job takes the exact win-x64 zip the job
  # above published and runs its own Sim.Ui.exe with --smoke: a real native ImGui context (cimgui.dll from the
  # zip), the game's real per-frame UI, scripted clicks/keys/wheel/drags over every visible control in eight
  # states, then a seeded monkey — headless, no window, no GPU. Any exception, frame defect, silent control or
  # native assertion fails the job. Sim.Ui is a GUI-subsystem exe, so pwsh is told to WAIT for it and its
  # stdout is redirected to a file; --smoke routes C-runtime assert dialogs to stderr and stops itself after
  # 45 min (a hang is a failure, not a wait).
  windows-smoke:
    needs: ui-artifact
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Download the published win-x64 build
        uses: actions/download-artifact@v4
        with:
          name: sim-ui-win-x64-${{ needs.ui-artifact.outputs.sha }}
          path: sim-ui

      - name: Smoke the shipped Sim.Ui.exe (headless ImGui, no GPU)
        shell: pwsh
        run: |
          $exe = Resolve-Path "sim-ui/app/Sim.Ui.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke","--monkey","300","--report","smoke-report.md" `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt
          Get-Content smoke-err.txt
          Write-Host "Sim.Ui.exe --smoke exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "the playability smoke gate FAILED on Windows (exit $($p.ExitCode))" }
          if (-not (Select-String -Path smoke-out.txt -Pattern "SMOKE PASSED" -Quiet)) { throw "no SMOKE PASSED line" }

      - name: Control - the pre-fix renderer configuration must abort (informational)
        # The same live UI with RendererHasVtxOffset NOT declared, opened on Research: it must die with ImGui's
        # 16-bit assertion, proving the gate above would have caught the Director's crash on this OS too.
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Resolve-Path "sim-ui/app/Sim.Ui.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-control-prefix","--timeout-minutes","5" `
            -NoNewWindow -PassThru -RedirectStandardOutput control-out.txt -RedirectStandardError control-err.txt
          if (-not $p.WaitForExit(360000)) { $p.Kill(); throw "control did not terminate" }
          Get-Content control-out.txt
          Get-Content control-err.txt
          Write-Host "control exit code: $($p.ExitCode)"
          $text = (Get-Content control-out.txt -Raw) + (Get-Content control-err.txt -Raw)
          if ($p.ExitCode -eq 0 -or $text -match "CONTROL DID NOT REPRODUCE") { throw "the control did not abort" }
          if ($text -notmatch "Too many vertices") { Write-Host "aborted (exit $($p.ExitCode)) without the assertion text on stderr" }

      - name: Upload the smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-report-${{ needs.ui-artifact.outputs.sha }}
          path: |
            smoke-report.md
            smoke-out.txt
            smoke-err.txt
            control-out.txt
            control-err.txt
          if-no-files-found: warn
          retention-days: 30
