# CR-013 diagnostic (T4.19 lane E): the SAME commit, the SAME three commands,
# on a Windows runner and a Linux runner, so the two halves of the
# cross-platform comparison are runner-vs-runner and not runner-vs-somebody's
# container. Dispatch only — this is an instrument, not a gate; the gate is
# CR-013 option 3 and is the director's call.
#
# Each job produces turn-1/2/3 founded saves (seed 42, canonical world) and the
# `sim hash` of each, and uploads them. Download both artifacts and run
#   sim diff linux-turnN.bin win-turnN.bin
# to get the first divergent table/row/field (CR-013 §8 records the result).
name: xplat-diagnostic

on:
  workflow_dispatch:
  # T4.19: workflow_dispatch resolves a workflow by filename ONLY when that file
  # exists on the default branch; this instrument lives on a feature branch and
  # main is not to be modified, so the dispatch API returns 404 for it. A push
  # trigger scoped to the diagnostic branches is the one way to run it without
  # touching main. It is still an instrument, not a gate.
  push:
    branches: ['t4.19-xplat-run']

jobs:
  windows:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build CLI (Release)
        run: dotnet build Sim.Cli/Sim.Cli.csproj -c Release

      - name: Run seed 42 to turns 1, 2, 3 and hash each save
        shell: pwsh
        run: |
          $cli = "Sim.Cli\bin\Release\net10.0\Sim.Cli.dll"
          New-Item -ItemType Directory -Force out | Out-Null
          $info = @("commit ${{ github.sha }}", "runner windows-latest (${{ runner.os }} ${{ runner.arch }})")
          $info += (dotnet --version | ForEach-Object { "sdk $_" })
          $info += (dotnet --info | Select-String 'RID:' | ForEach-Object { $_.Line.Trim() })
          foreach ($n in 1, 2, 3) {
            dotnet $cli run --founded --seed 42 --turns $n --save-at $n --save out\win-turn$n.bin
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($n in 1, 2, 3) {
            $h = (dotnet $cli hash out\win-turn$n.bin).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $info += "turn $n $h"
          }
          $info | Out-File -Encoding ascii out\hashes.txt
          Get-Content out\hashes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xplat-win-x64-${{ github.sha }}
          path: out/
          retention-days: 30
          if-no-files-found: error

  linux:
    name: linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build CLI (Release)
        run: dotnet build Sim.Cli/Sim.Cli.csproj -c Release

      - name: Run seed 42 to turns 1, 2, 3 and hash each save
        run: |
          set -euo pipefail
          CLI="dotnet Sim.Cli/bin/Release/net10.0/Sim.Cli.dll"
          mkdir -p out
          {
            echo "commit ${{ github.sha }}"
            echo "runner ubuntu-latest (${{ runner.os }} ${{ runner.arch }})"
            echo "sdk $(dotnet --version)"
            dotnet --info | grep 'RID:' | sed 's/^ *//'
          } > out/hashes.txt
          for n in 1 2 3; do
            $CLI run --founded --seed 42 --turns $n --save-at $n --save out/linux-turn$n.bin
          done
          for n in 1 2 3; do
            echo "turn $n $($CLI hash out/linux-turn$n.bin)" >> out/hashes.txt
          done
          cat out/hashes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xplat-linux-x64-${{ github.sha }}
          path: out/
          retention-days: 30
          if-no-files-found: error
